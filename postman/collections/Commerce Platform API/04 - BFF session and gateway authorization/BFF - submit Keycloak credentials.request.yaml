$kind: http-request
description: Submits local fixture credentials to the Keycloak login form. Credentials come from bffUsername and bffPassword environment variables.
url: "{{keycloakLoginAction}}"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    username: "{{bffUsername}}"
    password: "{{bffPassword}}"
    credentialId: ''
scripts:
  - type: beforeRequest
    code: |-
      pm.test('bffUsername is configured', function () {
        pm.expect(pm.environment.get('bffUsername')).to.be.a('string').and.not.empty;
      });
      pm.test('bffPassword is configured in current environment values', function () {
        pm.expect(pm.environment.get('bffPassword')).to.be.a('string').and.not.empty;
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Keycloak redirects after credential submission', function () { pm.response.to.have.status(302); });
      const location = pm.response.headers.get('Location');
      const expectedCallbackBase = pm.variables.replaceIn('{{identityBaseUrl}}/login/oauth2/code/keycloak?');
      pm.test('redirects to the BFF authorization callback', function () { pm.expect(location).to.include(expectedCallbackBase); });
      pm.collectionVariables.set('callbackUrl', location);
    language: text/javascript
settings:
  followRedirects: false
order: 1750
