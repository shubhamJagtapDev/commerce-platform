$kind: http-request
description: Consumes the one-time authorization callback and stores commerce-session in Postman's localhost cookie jar.
url: "{{callbackUrl}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('BFF callback redirects after creating the session', function () { pm.response.to.have.status(302); });
      pm.test('BFF callback redirects to CSRF retrieval', function () { pm.expect(pm.response.headers.get('Location')).to.include('/bff/csrf'); });
      pm.test('Postman received the opaque commerce-session cookie', function () {
        pm.expect(pm.cookies.get('commerce-session')).to.be.a('string').and.not.empty;
      });
    language: text/javascript
settings:
  followRedirects: false
order: 1900
