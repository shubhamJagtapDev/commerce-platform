name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Unit, architecture, contract, and secret checks
        run: ./gradlew clean check --no-daemon

      - name: Migration and integration environment
        run: ./dev start

      - name: Security-negative, readiness, and database-isolation checks
        run: ./dev verify

      - name: Canary and evidence manifest
        run: ./dev digest > foundation-digests.sha256

      - name: Stop local environment
        if: always()
        run: ./dev stop

      - name: Upload Gate 1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gate-1-foundation-evidence
          path: foundation-digests.sha256
          if-no-files-found: error
