name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-validation:
    name: Platform validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Mandatory quality gate (format, analysis, null safety, architecture, tests, contracts, secrets)
        run: ./gradlew clean check --no-daemon

      - name: Migration and integration environment
        run: ./dev start

      - name: Security-negative, readiness, and database-isolation checks
        run: ./dev verify

      - name: Generate validation evidence manifest
        run: ./dev digest > validation-evidence.sha256

      - name: Stop local environment
        if: always()
        run: ./dev stop

      - name: Upload validation evidence manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-validation-evidence
          path: validation-evidence.sha256
          if-no-files-found: error
