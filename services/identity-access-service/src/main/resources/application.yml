spring:
  application:
    name: identity-access-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${IDENTITY_OIDC_CLIENT_ID:identity-access-bff}
            client-secret: ${IDENTITY_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - roles
        provider:
          keycloak:
            authorization-uri: ${IDENTITY_OIDC_AUTHORIZATION_URI:http://localhost:8082/realms/commerce/protocol/openid-connect/auth}
            token-uri: ${IDENTITY_OIDC_TOKEN_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/token}
            user-info-uri: ${IDENTITY_OIDC_USER_INFO_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/userinfo}
            user-name-attribute: sub
            jwk-set-uri: ${IDENTITY_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}

commerce:
  auth:
    public-issuer: ${IDENTITY_OIDC_PUBLIC_ISSUER:http://localhost:8082/realms/commerce}
    client-id: ${IDENTITY_OIDC_CLIENT_ID:identity-access-bff}
    public-origin: ${IDENTITY_BFF_PUBLIC_ORIGIN:http://localhost:8080}
    private-discovery-uri: ${IDENTITY_OIDC_PRIVATE_DISCOVERY_URI:http://keycloak:8080/realms/commerce/.well-known/openid-configuration}
    private-jwks-uri: ${IDENTITY_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}
    session-cookie-name: ${IDENTITY_SESSION_COOKIE_NAME:commerce-session}
    secure-cookie: ${IDENTITY_SESSION_SECURE_COOKIE:false}
    transaction-ttl: PT10M
    session-idle-ttl: PT30M
    session-absolute-ttl: PT8H
    crypto:
      encryption-key-id: ${IDENTITY_AUTH_ENCRYPTION_KEY_ID}
      encryption-key: ${IDENTITY_AUTH_ENCRYPTION_KEY}
      hmac-key-id: ${IDENTITY_AUTH_HMAC_KEY_ID}
      hmac-key: ${IDENTITY_AUTH_HMAC_KEY}
  gateway:
    routes:
      - id: catalog-authorization-probe
        method: POST
        path: /api/v1/catalog/authorization-probes
        target: ${CATALOG_PRIVATE_URI:http://catalog-service:8081}
        access: MAINTAINER
        deadline: PT1S
        max-request-bytes: 1024
        max-header-bytes: 16384
        admission-capacity: 20

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,crypto,keycloak
server:
  port: ${IDENTITY_HTTP_PORT:8080}
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
