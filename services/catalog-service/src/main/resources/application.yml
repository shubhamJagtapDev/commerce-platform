spring:
  application:
    name: catalog-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL}
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    # Don't keep Hibernate Session open for entire HTTP request
    open-in-view: false

    hibernate:
      # Never automatically modify the database schema.
      # Fail startup if entities don't match the schema.
      ddl-auto: validate

    properties:
      # Batch up to 50 compatible JDBC operations
      hibernate.jdbc.batch_size: 50

      # Group Inserts by entity type
      hibernate.order_inserts: true

      # Group Updates by entity type
      hibernate.order_updates: true
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CATALOG_OIDC_ISSUER:http://localhost:8082/realms/commerce}
          jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}

commerce:
  catalog-security:
    issuer: ${CATALOG_OIDC_ISSUER:http://localhost:8082/realms/commerce}
    jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}
    audience: ${CATALOG_OIDC_AUDIENCE:catalog-api}
    authorized-party: ${CATALOG_OIDC_AUTHORIZED_PARTY:identity-access-bff}
    idempotency-hmac-key: ${CATALOG_IDEMPOTENCY_HMAC_KEY}
    idempotency-retention: PT24H
    idempotency-cleanup-interval: ${CATALOG_IDEMPOTENCY_CLEANUP_INTERVAL:PT1H}
  catalog-lifecycle:
    receipt-retention: PT24H
    lifecycle-keys:
      active:
        id: ${CATALOG_LIFECYCLE_HMAC_KEY_ID}
        material: ${CATALOG_LIFECYCLE_HMAC_KEY}
      retained: [ ]
    audit-keys:
      active:
        id: ${CATALOG_AUDIT_HMAC_KEY_ID}
        material: ${CATALOG_AUDIT_HMAC_KEY}
      retained: [ ]

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
server:
  port: ${CATALOG_HTTP_PORT:8081}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
