spring:
  application:
    name: catalog-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL}
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CATALOG_OIDC_ISSUER:http://localhost:8082/realms/commerce}
          jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}

commerce:
  catalog-security:
    issuer: ${CATALOG_OIDC_ISSUER:http://localhost:8082/realms/commerce}
    jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/commerce/protocol/openid-connect/certs}
    audience: ${CATALOG_OIDC_AUDIENCE:catalog-api}
    authorized-party: ${CATALOG_OIDC_AUTHORIZED_PARTY:identity-access-bff}
    idempotency-hmac-key: ${CATALOG_IDEMPOTENCY_HMAC_KEY}
    idempotency-retention: PT24H
    idempotency-cleanup-interval: ${CATALOG_IDEMPOTENCY_CLEANUP_INTERVAL:PT1H}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
server:
  port: ${CATALOG_HTTP_PORT:8081}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
