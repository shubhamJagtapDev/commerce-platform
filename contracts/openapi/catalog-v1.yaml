            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Well-formed candidate contains invalid values, field limits or relationships. Never echo
        tokens, keys, rejected values, raw JSON/URLs or provider internals.
    PublicationIncompleteProblem:
