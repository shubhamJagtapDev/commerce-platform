      description: >-
        Candidate is not complete for publication. Never echo tokens, keys, rejected values, raw
        JSON/URLs or provider internals.
    RateLimitedProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
