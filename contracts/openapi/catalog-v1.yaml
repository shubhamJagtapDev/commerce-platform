openapi: 3.1.0
info:
  title: Commerce Catalog API
  version: 1.0.0
  description: >-
    Approved Phase 1 maintainer contract (Gate 0, 2026-09-09), ahead of handler
    implementation. Preserves the COM-46 probe including its 201/200 replay
    convention. Lifecycle replay instead preserves original status/body/Location.
    No public search/detail routes. Example category IDs are not fixture declarations.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/catalog/authorization-probes:
    post:
      operationId: createCatalogAuthorizationProbe
      summary: Prove the catalog-maintainer authorization boundary.
      security:
        - catalogBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Deduplicates the same command for 24 hours. Reuse with a different
            request during that window is rejected; reuse after expiration is
            treated as a new command.
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationProbeRequest"
      responses:
        "201":
          description: The authorized probe mutation was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationProbeResponse"
        "200":
          description: A completed probe was replayed with the same idempotency key and request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationProbeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/catalog/maintenance/products":
    post:
      operationId: "createCatalogDraft"
      summary: "Create a private product draft."
      tags:
        - "Catalog maintenance"
      security:
        - catalogBearer: []
      description: >-
        Valid Catalog JWT and active local maintainer grant required. No caller-supplied
        actor/owner/role/grant authority. UTF-8 application/json; maximum actual body 256 KiB and
        headers 16 KiB. Unknown query parameters and duplicate scalar query values return 400.
        Authorize against the current active Catalog grant before applying or replaying. Replays
        within 24 hours preserve original status, body and Location and set Idempotency-
        Replayed=true; original successes use false. Resolve replay before current product
        existence/state/version checks, including after later withdrawal or draft discard. A receipt
        is historical command data, never a reread of mutable current state. Rejected requests
        create no successful receipt. For uncertain outcomes retry the same key/body within the
        window; no automatic mutation retries. After expiry reconcile an uncertain create before
        starting another command.
      x-max-body-bytes: 262144
      x-max-header-bytes: 16384
      parameters:
        - $ref: "#/components/parameters/LifecycleIdempotencyKey"
      responses:
        "201":
          description: "Committed result, including same-status replay."
          headers:
            Cache-Control:
              $ref: "#/components/headers/MaintainerCacheControl"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              $ref: "#/components/headers/ProductLocation"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CommandOutcome"
        "400":
          $ref: "#/components/responses/MaintenanceInvalidRequest"
        "401":
          $ref: "#/components/responses/MaintenanceAuthenticationRequired"
        "403":
          $ref: "#/components/responses/MaintenanceForbidden"
        "409":
          $ref: "#/components/responses/MaintenanceIdempotencyConflictOrVariantIdConflict"
        "413":
          $ref: "#/components/responses/MaintenanceRequestTooLarge"
        "415":
          $ref: "#/components/responses/MaintenanceUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/MaintenanceCandidateInvalid"
        "429":
          $ref: "#/components/responses/MaintenanceRateLimited"
        "500":
          $ref: "#/components/responses/MaintenanceInternalError"
        "503":
          $ref: "#/components/responses/MaintenanceDependencyUnavailable"
        "504":
          $ref: "#/components/responses/MaintenanceGatewayTimeout"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
    get:
      operationId: "listMaintainerProducts"
      summary: "List private products by UUID keyset."
      tags:
        - "Catalog maintenance"
      security:
        - catalogBearer: []
      description: >-
        Valid Catalog JWT and active local maintainer grant required. No caller-supplied
        actor/owner/role/grant authority. Maximum headers 16 KiB; bodyless query. Unknown query
        parameters and duplicate scalar query values return 400. No request body is accepted. GET
        must not change product/version/replay expiry or commerce state. HEAD/OPTIONS must not
        invoke mutation handlers.
      x-max-body-bytes: 0
      x-max-header-bytes: 16384
      parameters:
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/ProductLimit"
      responses:
        "200":
          description: "Bounded private query result."
          headers:
            Cache-Control:
              $ref: "#/components/headers/MaintainerCacheControl"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/MaintenanceInvalidRequest"
        "401":
          $ref: "#/components/responses/MaintenanceAuthenticationRequired"
        "403":
          $ref: "#/components/responses/MaintenanceForbidden"
        "413":
          $ref: "#/components/responses/MaintenanceRequestTooLarge"
        "429":
          $ref: "#/components/responses/MaintenanceRateLimited"
        "500":
          $ref: "#/components/responses/MaintenanceInternalError"
        "503":
          $ref: "#/components/responses/MaintenanceDependencyUnavailable"
        "504":
          $ref: "#/components/responses/MaintenanceGatewayTimeout"
