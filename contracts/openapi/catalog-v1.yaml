        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:internal-error"
        title:
          type: "string"
        status:
          type: "integer"
          const: 500
        code:
          type: "string"
          const: "INTERNAL_ERROR"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Unexpected integrity failure or defect. Generic safe response; log once with correlation,
        never disclose SQL or rejected values. Never echo tokens, keys, rejected values, raw
        JSON/URLs or provider internals.
  parameters:
    ProductId:
      name: "productId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    VariantId:
      name: "variantId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    LifecycleIdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: >-
        CSPRNG key with at least 128 bits of randomness; 16–128 allowed characters (UUID strings
        fit). Scope: authenticated grant + operation. Target IDs, expectedVersion and normalized
        full request are fingerprinted. Never put keys in URLs. 24 hours from successful appliedAt;
        replay never extends expiry. Expired keys are new commands.
      schema:
        type: "string"
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]{16,128}$"
    After:
      name: "after"
      in: "query"
      required: false
      schema:
        type: "string"
        format: "uuid"
      description: >-
        Strictly seek after this UUID in ascending PostgreSQL UUID order; unknown IDs are valid seek
        positions.
    ProductLimit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
    CategoryLimit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 50
    State:
      name: "state"
      in: "query"
      required: false
      schema:
        $ref: "#/components/schemas/ProductState"
  headers:
    MaintainerCacheControl:
      description: "Required on maintainer successes and errors."
      schema:
        type: "string"
        const: "no-store"
    IdempotencyReplayed:
      description: >-
        Required on command success: false for original application, true for replay. Replay
        preserves original status/body/Location.
      schema:
        type: "boolean"
    ProductLocation:
      description: "Required on create, including replay: /api/v1/catalog/maintenance/products/{productId}."
      schema:
        type: "string"
        format: "uri-reference"
    RetryAfter:
      description: "Required on 429; retry delay in seconds or HTTP date."
      schema:
        type: "string"
  responses:
    InvalidRequest:
      description: The request is malformed or violates the probe contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthenticationRequired:
      description: A valid Catalog access token is required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated principal has no active Catalog grant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The unexpired idempotency key is already associated with another request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MaintenanceInvalidRequest:
      description: "INVALID_REQUEST"
      headers:
        Cache-Control:
          $ref: "#/components/headers/MaintainerCacheControl"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/InvalidRequestProblem"
    MaintenanceAuthenticationRequired:
      description: "AUTHENTICATION_REQUIRED"
      headers:
        Cache-Control:
          $ref: "#/components/headers/MaintainerCacheControl"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredProblem"
    MaintenanceForbidden:
      description: "FORBIDDEN"
      headers:
        Cache-Control:
          $ref: "#/components/headers/MaintainerCacheControl"
