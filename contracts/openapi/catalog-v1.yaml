            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Rejected before domain work, with Retry-After and no partial effect. Never echo tokens,
        keys, rejected values, raw JSON/URLs or provider internals.
    DependencyUnavailableProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:dependency-unavailable"
        title:
          type: "string"
        status:
          type: "integer"
          const: 503
        code:
          type: "string"
          const: "DEPENDENCY_UNAVAILABLE"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
        outcome:
          type: "string"
          enum:
            - "NOT_APPLIED"
            - "UNKNOWN"
      description: >-
        Authority unavailable. NOT_APPLIED only with proof of no commit; otherwise UNKNOWN. Never
        infer rollback from a connection failure. Never echo tokens, keys, rejected values, raw
        JSON/URLs or provider internals.
    GatewayTimeoutProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:gateway-timeout"
        title:
