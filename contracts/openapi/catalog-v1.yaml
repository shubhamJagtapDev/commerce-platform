        "503":
          $ref: "#/components/responses/MaintenanceDependencyUnavailable"
        "504":
          $ref: "#/components/responses/MaintenanceGatewayTimeout"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
  "/api/v1/catalog/maintenance/categories":
    get:
      operationId: "listMaintainerCategories"
      summary: "List immutable two-level category fixtures."
      tags:
        - "Catalog maintenance"
      security:
        - catalogBearer: []
      description: >-
        Valid Catalog JWT and active local maintainer grant required. No caller-supplied
        actor/owner/role/grant authority. Maximum headers 16 KiB; bodyless query. Unknown query
        parameters and duplicate scalar query values return 400. No request body is accepted. GET
        must not change product/version/replay expiry or commerce state. HEAD/OPTIONS must not
        invoke mutation handlers.
      x-max-body-bytes: 0
      x-max-header-bytes: 16384
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/CategoryLimit"
      responses:
        "200":
          description: "Bounded private query result."
          headers:
            Cache-Control:
              $ref: "#/components/headers/MaintainerCacheControl"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "400":
          $ref: "#/components/responses/MaintenanceInvalidRequest"
        "401":
          $ref: "#/components/responses/MaintenanceAuthenticationRequired"
        "403":
          $ref: "#/components/responses/MaintenanceForbidden"
        "413":
          $ref: "#/components/responses/MaintenanceRequestTooLarge"
        "429":
          $ref: "#/components/responses/MaintenanceRateLimited"
        "500":
          $ref: "#/components/responses/MaintenanceInternalError"
        "503":
          $ref: "#/components/responses/MaintenanceDependencyUnavailable"
        "504":
          $ref: "#/components/responses/MaintenanceGatewayTimeout"
  /actuator/health/liveness:
    get:
      operationId: catalogLiveness
      responses:
        "200":
          description: Process is live.
  /actuator/health/readiness:
    get:
      operationId: catalogReadiness
      responses:
        "200":
          description: Service and owned database are ready.
        "503":
          description: The owned authoritative database is unavailable.
components:
  securitySchemes:
    catalogBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthorizationProbeRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          const: COM_46_AUTHORIZATION_GATE
    AuthorizationProbeResponse:
      type: object
      additionalProperties: false
      required: [probeId, version, committedAt]
      properties:
        probeId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        committedAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
    CatalogVersion:
      type: "integer"
      format: "int64"
      minimum: 0
    ProductState:
      type: "string"
      enum:
        - "DRAFT"
        - "PUBLISHED"
        - "WITHDRAWN"
    CommandOperation:
      type: "string"
      enum:
        - "CREATE_DRAFT"
        - "REPLACE_CANDIDATE"
        - "PUBLISH"
        - "REPUBLISH"
        - "WITHDRAW_PRODUCT"
        - "WITHDRAW_VARIANT"
        - "REACTIVATE"
        - "DISCARD"
    Money:
      type: "object"
      additionalProperties: false
      required:
        - "amount"
        - "currency"
      properties:
        amount:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,8})(\\.[0-9]{1,2})?$"
          not:
            enum:
              - "0"
              - "0.0"
              - "0.00"
          examples:
            - "0.01"
            - "1299.00"
            - "999999999.99"
          description: >-
            Exact decimal string in inclusive range 0.01–999999999.99. Reject whitespace, exponent
            notation, leading zeros, JSON numbers and excess decimals including trailing zeros.
            Never round or convert currency.
        currency:
          type: "string"
          const: "INR"
      examples:
        - amount: "1299.00"
          currency: "INR"
    ImageUrl:
      type: "string"
      format: "uri"
      maxLength: 2048
      pattern: "^https://"
      description: >-
        Trim first. Absolute HTTPS URL with a host, no user-info or fragment. Preserve path/query
        and array order; reject exact duplicates after trimming. Syntax validation only: never
        fetch, resolve DNS, inspect media or log URLs.
    LongDescription:
      type:
        - "object"
        - "null"
      additionalProperties: true
      description: >-
        Opaque JSON object; omitted/null clears the document on full replacement. Arbitrary nested
        JSON values; no business schema. Root object depth 1, maximum depth 10, serialized UTF-8
        content at most 32768 bytes; PostgreSQL jsonb::text must also fit 32768 bytes. Reject
        duplicate keys, NUL, unpaired surrogates, numeric tokens over 128 characters and absolute
        decimal exponent over 1000. Parse numbers exactly, never through double. Preserve JSON
        values, not whitespace/key order; do not trim or normalize strings inside this document. Not
        a search field.
      x-max-serialized-utf8-bytes: 32768
      x-max-json-depth: 10
      x-max-number-token-characters: 128
      x-max-absolute-decimal-exponent: 1000
    CandidateVariant:
      type: "object"
      additionalProperties: false
      required:
        - "variantId"
        - "optionValues"
        - "sellable"
      properties:
        variantId:
          type: "string"
          format: "uuid"
          description: >-
            Caller-generated UUID v4 for a new identity, or existing ID owned by this product.
            Foreign/conflicting IDs return generic VARIANT_ID_CONFLICT. Once publicly sellable,
            dimension/selection meaning cannot change under this ID.
        optionValues:
          type: "array"
          minItems: 0
          maxItems: 2
          items:
            type: "string"
            minLength: 1
            maxLength: 50
            description: >-
              Limits count Unicode code points after NFC normalization and trimming; supplied values
              must be nonblank. Never truncate.
        sellable:
          type: "boolean"
          description: "Explicit candidate offer intent, not inventory or public visibility."
        price:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
      description: >-
        Null/omitted price is incomplete draft data. Any supplied price must be valid, even on a
        non-sellable variant. Publication requires prices for every sellable variant.
    Candidate:
      type: "object"
      additionalProperties: false
      required:
        - "mainCategoryId"
        - "imageUrls"
        - "optionDimensions"
        - "variants"
      properties:
        name:
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 200
              description: >-
                Limits count Unicode code points after NFC normalization and trimming; supplied
                values must be nonblank. Never truncate.
            - type: "null"
        shortDescription:
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 2000
              description: >-
                Limits count Unicode code points after NFC normalization and trimming; supplied
                values must be nonblank. Never truncate.
            - type: "null"
        mainCategoryId:
          type: "string"
          format: "uuid"
          description: "Required existing main category."
        subcategoryId:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "Must belong to mainCategoryId."
            - type: "null"
        imageUrls:
          type: "array"
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/ImageUrl"
          uniqueItems: true
        longDescription:
          $ref: "#/components/schemas/LongDescription"
        optionDimensions:
          type: "array"
          minItems: 0
          maxItems: 2
          items:
            type: "string"
            minLength: 1
            maxLength: 50
            description: >-
              Limits count Unicode code points after NFC normalization and trimming; supplied values
              must be nonblank. Never truncate.
          uniqueItems: true
        variants:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CandidateVariant"
      description: >-
        Full private candidate replacement. Draft text/price may be incomplete; supplied data must
        be valid. Distinct variant IDs and option selections; option values match dimension
        positions and are case-sensitive. No dimensions requires exactly one explicit default
        variant with empty optionValues. Publication requires name, shortDescription and at least
        one sellable variant, with all sellable variants complete. Images and longDescription remain
        optional content.
    CreateDraftRequest:
      type: "object"
      additionalProperties: false
      required:
        - "candidate"
      properties:
        candidate:
          $ref: "#/components/schemas/Candidate"
      examples:
        - candidate:
            mainCategoryId: "197f6853-810b-49a5-ad42-bd2379e7297e"
            imageUrls: []
            optionDimensions: []
            variants:
              - variantId: "d0087074-1f29-4ca4-ac87-3582d1770765"
                optionValues: []
                sellable: true
                price: null
    ReplaceCandidateRequest:
      type: "object"
      additionalProperties: false
      required:
        - "expectedVersion"
        - "candidate"
      properties:
        expectedVersion:
          $ref: "#/components/schemas/CatalogVersion"
        candidate:
          $ref: "#/components/schemas/Candidate"
    LifecycleRequest:
      type: "object"
      additionalProperties: false
      required:
        - "expectedVersion"
      properties:
        expectedVersion:
          $ref: "#/components/schemas/CatalogVersion"
    CommandOutcome:
      type: "object"
      additionalProperties: false
      required:
        - "commandId"
        - "operation"
        - "productId"
        - "variantId"
        - "resultVersion"
        - "resultState"
        - "publicationId"
        - "appliedAt"
      properties:
        commandId:
          type: "string"
          format: "uuid"
        operation:
          $ref: "#/components/schemas/CommandOperation"
        productId:
          type: "string"
          format: "uuid"
        variantId:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        resultVersion:
          $ref: "#/components/schemas/CatalogVersion"
        resultState:
          type: "string"
          enum:
            - "DRAFT"
            - "PUBLISHED"
            - "WITHDRAWN"
            - "DISCARDED"
        publicationId:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        appliedAt:
          type: "string"
          format: "date-time"
      description: >-
        Immutable committed command result, not current product state. Version 0 on create; prior
        version +1 for every later success, including discard. DISCARDED exists only in receipts.
        Last-variant withdrawal reports WITHDRAWN and retains the last publication ID. appliedAt is
        the recorded application time within the committed transaction. No actor/grant/key/audit
        content.
      examples:
        - commandId: "cba700dd-579c-493d-8914-1f940a3411e2"
          operation: "PUBLISH"
          productId: "b375f54a-4e57-4d78-91e8-70c4ad604477"
          variantId: null
          resultVersion: 1
          resultState: "PUBLISHED"
          publicationId: "e2e746a2-c732-43b7-b399-964e993211aa"
          appliedAt: "2026-09-03T08:00:00Z"
    ResponseMoney:
      type: "object"
      additionalProperties: false
      required:
        - "amount"
        - "currency"
      properties:
        amount:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,8})\\.[0-9]{2}$"
          not:
            enum:
              - "0"
              - "0.0"
              - "0.00"
          examples:
            - "0.01"
            - "1299.00"
            - "999999999.99"
          description: "Exact INR amount rendered with exactly two decimals; no rounding."
        currency:
          type: "string"
          const: "INR"
    ResponseCandidateVariant:
      type: "object"
      additionalProperties: false
      required:
        - "variantId"
        - "optionValues"
        - "sellable"
      properties:
        variantId:
          type: "string"
          format: "uuid"
          description: >-
            Caller-generated UUID v4 for a new identity, or existing ID owned by this product.
            Foreign/conflicting IDs return generic VARIANT_ID_CONFLICT. Once publicly sellable,
            dimension/selection meaning cannot change under this ID.
        optionValues:
          type: "array"
          minItems: 0
          maxItems: 2
          items:
            type: "string"
            minLength: 1
            maxLength: 50
            description: >-
              Limits count Unicode code points after NFC normalization and trimming; supplied values
              must be nonblank. Never truncate.
        sellable:
          type: "boolean"
          description: "Explicit candidate offer intent, not inventory or public visibility."
        price:
          anyOf:
            - $ref: "#/components/schemas/ResponseMoney"
            - type: "null"
      description: >-
        Null/omitted price is incomplete draft data. Any supplied price must be valid, even on a
        non-sellable variant. Publication requires prices for every sellable variant.
    ResponseCandidate:
      type: "object"
      additionalProperties: false
      required:
        - "mainCategoryId"
        - "imageUrls"
        - "optionDimensions"
        - "variants"
      properties:
        name:
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 200
              description: >-
                Limits count Unicode code points after NFC normalization and trimming; supplied
                values must be nonblank. Never truncate.
            - type: "null"
        shortDescription:
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 2000
              description: >-
                Limits count Unicode code points after NFC normalization and trimming; supplied
                values must be nonblank. Never truncate.
            - type: "null"
        mainCategoryId:
          type: "string"
          format: "uuid"
          description: "Required existing main category."
        subcategoryId:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "Must belong to mainCategoryId."
            - type: "null"
        imageUrls:
          type: "array"
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/ImageUrl"
          uniqueItems: true
        longDescription:
          $ref: "#/components/schemas/LongDescription"
        optionDimensions:
          type: "array"
          minItems: 0
          maxItems: 2
          items:
            type: "string"
            minLength: 1
            maxLength: 50
            description: >-
              Limits count Unicode code points after NFC normalization and trimming; supplied values
              must be nonblank. Never truncate.
          uniqueItems: true
        variants:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ResponseCandidateVariant"
      description: >-
        Full private candidate replacement. Draft text/price may be incomplete; supplied data must
        be valid. Distinct variant IDs and option selections; option values match dimension
        positions and are case-sensitive. No dimensions requires exactly one explicit default
        variant with empty optionValues. Publication requires name, shortDescription and at least
        one sellable variant, with all sellable variants complete. Images and longDescription remain
        optional content.
    MaintainerProduct:
      type: "object"
      additionalProperties: false
      required:
        - "productId"
        - "version"
        - "state"
        - "firstPublishedAt"
        - "currentPublicationId"
        - "candidate"
      properties:
        productId:
          type: "string"
          format: "uuid"
        version:
          $ref: "#/components/schemas/CatalogVersion"
        state:
          $ref: "#/components/schemas/ProductState"
        firstPublishedAt:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
        currentPublicationId:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        candidate:
          $ref: "#/components/schemas/ResponseCandidate"
    ProductListItem:
      type: "object"
      additionalProperties: false
      required:
        - "productId"
        - "version"
        - "state"
        - "name"
        - "currentPublicationId"
      properties:
        productId:
          type: "string"
          format: "uuid"
        version:
          $ref: "#/components/schemas/CatalogVersion"
        state:
          $ref: "#/components/schemas/ProductState"
        name:
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 200
              description: >-
                Limits count Unicode code points after NFC normalization and trimming; supplied
                values must be nonblank. Never truncate.
            - type: "null"
        currentPublicationId:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
    Category:
      type: "object"
      additionalProperties: false
      required:
        - "categoryId"
        - "name"
        - "level"
        - "mainCategoryId"
      properties:
        categoryId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        level:
          type: "string"
          enum:
            - "MAIN"
            - "SUB"
        mainCategoryId:
          type: "string"
          format: "uuid"
          description: "Own categoryId for MAIN; parent ID for SUB. Fixture IDs are globally distinct across levels."
    ProductPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "hasMore"
        - "nextAfter"
      properties:
        items:
          type: "array"
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductListItem"
        hasMore:
          type: "boolean"
        nextAfter:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
      description: >-
        UUID ascending keyset page, no total count or frozen cross-page snapshot. Fetch limit+1. If
        an extra row exists, return limit items, hasMore=true, nextAfter=last returned ID; otherwise
        hasMore=false and nextAfter=null. Unknown cursor IDs are valid seek positions; beyond end
        returns an empty page.
    CategoryPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "hasMore"
        - "nextAfter"
      properties:
        items:
          type: "array"
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/Category"
        hasMore:
          type: "boolean"
        nextAfter:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
      description: >-
        UUID ascending keyset page, no total count or frozen cross-page snapshot. Fetch limit+1. If
        an extra row exists, return limit items, hasMore=true, nextAfter=last returned ID; otherwise
        hasMore=false and nextAfter=null. Unknown cursor IDs are valid seek positions; beyond end
        returns an empty page.
    InvalidRequestProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:invalid-request"
        title:
          type: "string"
        status:
          type: "integer"
          const: 400
        code:
          type: "string"
          const: "INVALID_REQUEST"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Syntax, unknown/duplicate fields or query scalars, malformed/missing version/key/query. No
        successful receipt. Never echo tokens, keys, rejected values, raw JSON/URLs or provider
        internals.
    AuthenticationRequiredProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:authentication-required"
        title:
          type: "string"
        status:
          type: "integer"
          const: 401
        code:
          type: "string"
          const: "AUTHENTICATION_REQUIRED"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Missing or invalid Catalog identity; no domain effect. Never echo tokens, keys, rejected
        values, raw JSON/URLs or provider internals.
    ForbiddenProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:forbidden"
        title:
          type: "string"
        status:
          type: "integer"
          const: 403
        code:
          type: "string"
          const: "FORBIDDEN"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        No active local grant, wrong coarse role or browser security failure. Never echo tokens,
        keys, rejected values, raw JSON/URLs or provider internals.
    ProductNotFoundProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:product-not-found"
        title:
          type: "string"
        status:
          type: "integer"
          const: 404
        code:
          type: "string"
          const: "PRODUCT_NOT_FOUND"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Unknown product, including after discard. No foreign-resource disclosure. Never echo tokens,
        keys, rejected values, raw JSON/URLs or provider internals.
    VariantNotFoundProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:variant-not-found"
        title:
          type: "string"
        status:
          type: "integer"
          const: 404
        code:
          type: "string"
          const: "VARIANT_NOT_FOUND"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
      description: >-
        Variant is not in the authorized target product. No foreign-resource disclosure. Never echo
        tokens, keys, rejected values, raw JSON/URLs or provider internals.
    VersionConflictProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
          const: "urn:commerce:problem:version-conflict"
        title:
          type: "string"
        status:
          type: "integer"
          const: 409
        code:
          type: "string"
          const: "VERSION_CONFLICT"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
        currentVersion:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Only on an authorized version conflict."
      description: >-
        Stale expectedVersion. GET and consciously reconcile, then use a new key/version. No
        overwrite, merge or automatic retry. Never echo tokens, keys, rejected values, raw JSON/URLs
        or provider internals.
    LifecycleConflictProblem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri"
