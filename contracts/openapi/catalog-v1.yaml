        status:
          type: "integer"
          const: 504
        code:
          type: "string"
          const: "GATEWAY_TIMEOUT"
        correlationId:
          type: "string"
        violations:
          type: "array"
          minItems: 0
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
            properties:
              field:
                type: "string"
              code:
                type: "string"
        outcome:
          type: "string"
          enum:
            - "NOT_APPLIED"
            - "UNKNOWN"
      description: >-
        BFF deadline exhausted. Once dispatched, outcome is UNKNOWN; same-key/body recovery within
        the replay window. Never echo tokens, keys, rejected values, raw JSON/URLs or provider
        internals.
