openapi: 3.1.0
info:
  title: Commerce Identity Access API
  version: 1.0.0
  description: Versioned Identity Access boundary with BFF authentication and principal-derived customer account binding.
servers:
  - url: http://localhost:8080
paths:
  /bff/login:
    get:
      operationId: beginBffLogin
      summary: Start the fixed Keycloak Authorization Code with PKCE login flow.
      responses:
        "302":
          description: Browser redirect to the authorization endpoint.
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "503":
          $ref: "#/components/responses/KeycloakUnavailable"
  /bff/register:
    get:
      operationId: beginCustomerRegistration
      summary: Start bounded Keycloak-hosted customer registration using Authorization Code with PKCE.
      responses:
        "302":
          description: Browser redirect to the hosted registration flow.
        "404":
          description: Registration is disabled in this environment.
        "429":
          description: The direct peer exceeded the bounded registration-start rate.
          headers:
            Retry-After:
              schema:
                type: integer
        "503":
          $ref: "#/components/responses/KeycloakUnavailable"
  /login/oauth2/code/keycloak:
    get:
      operationId: keycloakAuthorizationCallback
      summary: Consume a one-time authorization callback.
      responses:
        "302":
          description: Successful callbacks redirect to /bff/csrf.
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "503":
          $ref: "#/components/responses/KeycloakUnavailable"
  /bff/csrf:
    get:
      operationId: bffCsrfToken
      summary: Obtain the synchronizer CSRF token for an active BFF session.
      responses:
        "200":
          description: Active-session CSRF token.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/MissingSession"
  /actuator/health/liveness:
    get:
      operationId: identityLiveness
      responses:
        "200":
          description: Process is live.
  /actuator/health/readiness:
    get:
      operationId: identityReadiness
      responses:
        "200":
          description: Service and owned database are ready.
        "503":
          description: An authoritative dependency is unavailable.
components:
  schemas:
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
  responses:
    AuthenticationFailed:
      description: Generic authentication failure without provider details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MissingSession:
      description: Active BFF session is absent or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    KeycloakUnavailable:
      description: Keycloak dependency is unavailable; no provider details are disclosed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
